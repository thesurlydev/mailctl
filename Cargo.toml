[package]
name = "mailctl"
version = "0.1.0"
edition = "2024"
description = "Read and send mail through Proton Mail Bridge"
authors = ["Shane Witbeck <shane@surly.dev>"]
license = "MIT"
repository = "https://github.com/thesurlydev/mailctl"

[dependencies]
# IMAP is the read path; Bridge speaks plain IMAP on loopback, so no TLS stack
# is needed for it. `async-imap` is the maintained client (the `imap` crate's
# stable release is from 2021 and 3.0 has been alpha since 2023).
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.5", default-features = false, features = ["runtime-tokio"] }
# SMTP submission for the send path.
# `rustls` needs an explicit crypto provider and trust source in lettre 0.11;
# aws-lc-rs matches what the rest of this machine uses, and the platform
# verifier keeps the system trust store authoritative.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }
# MIME and header parsing for message bodies.
mail-parser = "1.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
futures-util = "0.3"
anyhow = "1"
jiff = "0.2"
toml = "0.8"

[profile.release]
# Compile speed and disk over binary size, per the engineering rules.
debug = false
incremental = true
codegen-units = 16
lto = false
